[project]
name = "scalable-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harish gehlot", email = "gehloth03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.99.0",
    "fastapi>=0.139.0",
    "fastembed>=0.8.0",
    "groq>=1.5.0",
    "hydra-core>=1.3.4",
    "langcache>=0.13.0",
    "liteparse>=2.4.1",
    "llama-index>=0.14.23",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "omegaconf>=2.3.1",
    "prek>=0.4.8",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "redis-agent-memory>=0.1.1",
    "redisvl[langcache]>=0.23.0",
    "rust-just>=1.55.1",
    "sentence-transformers>=5.6.0",
    "transformers>=5.13.0",
    "uvicorn>=0.50.2",
]

[project.scripts]
scalable-rag = "scalable_rag:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
