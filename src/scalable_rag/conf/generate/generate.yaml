secrets:
  HF_TOKEN: ${oc.env:HF_TOKEN}
  QDRANT_API_KEY: ${oc.env:QDRANT_API_KEY}
  QDRANT_CLUSTER_ENDPOINT: ${oc.env:QDRANT_CLUSTER_ENDPOINT}
  GROQ_API_KEY: ${oc.env:GROQ_API_KEY}
retrieve:
  top_k: 5
  sparse_top_k: 12
semantic_cache:
  LANGCACHE_API_KEY: ${oc.env:LANGCACHE_API_KEY}
  LANGCACHE_SERVER_URL: ${oc.env:LANGCACHE_SERVER_URL}
  LANGCACHE_CACHE_ID: ${oc.env:LANGCACHE_CACHE_ID}
llms:
  model: 'llama-3.3-70b-versatile'
  rewriter:
    max_tokens: 100
    temperature: 0.3
  rerank: 
    max_tokens: 100
    temperature: 0.1
  answer:
    max_tokens: 512
    temperature: 0.7
model: 'xxx'